<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iMac Environmental Report — Document Q&amp;A</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>iMac Environmental Report</h1>
      <span class="subtitle">Document Q&amp;A</span>
      <button id="reset-btn" title="Clear conversation">Reset</button>
    </header>

    <main id="chat-window" class="chat-window">
      <div class="message ai">
        <div class="avatar ai-avatar">i</div>
        <div class="msg-content">
          <div class="sender">Assistant</div>
          <div class="bubble">Hi! Ask me about the iMac Product Environmental Report: carbon footprint, energy use, materials, packaging and more.</div>
        </div>
      </div>
    </main>

    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Type your question..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
